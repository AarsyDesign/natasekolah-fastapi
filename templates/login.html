<!DOCTYPE html>
<html lang="id" class="h-full bg-white text-zinc-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NataSekolah Absensi Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-zinc-50">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-flex w-10 h-10 rounded-lg bg-black text-white items-center justify-center font-bold text-sm tracking-wider shadow-sm mb-3">
        NS
      </div>
      <h1 class="text-lg font-semibold tracking-tight text-zinc-900">NataSekolah</h1>
      <p class="text-xs text-zinc-500 mt-1">Sistem Absensi Guru & Staf Mandiri</p>
    </div>

    <div class="bg-white border border-zinc-200 rounded-xl p-6 shadow-xs">
      {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-700 mb-1">Username / NIP</label>
          <input type="text" name="username" required autofocus placeholder="admin atau guru1"
                 class="w-full h-9 px-3 rounded-md border border-zinc-200 text-xs focus:outline-none focus:ring-1 focus:ring-black">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-700 mb-1">Password</label>
          <input type="password" name="password" required placeholder="admin123 / guru123"
                 class="w-full h-9 px-3 rounded-md border border-zinc-200 text-xs focus:outline-none focus:ring-1 focus:ring-black">
        </div>
        <button type="submit" class="w-full h-9 rounded-md bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium transition-colors shadow-xs">
          Masuk
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-zinc-100 text-[11px] text-zinc-500 space-y-1">
        <div class="font-medium text-zinc-700">Akun Demo Cepat:</div>
        <div class="flex justify-between font-mono"><span>Guru 1 (GPS/QR):</span> <span>guru1 / guru123</span></div>
        <div class="flex justify-between font-mono"><span>Admin Piket:</span> <span>admin / admin123</span></div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
